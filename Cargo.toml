[workspace]
resolver = "2"
members = [
    "crates/ull-esp-core",
    "crates/ull-esp-platform",
    "boards/esp32-devkit-v1",
    "boards/ull-pocket",
    "examples/sht3x-ssd1306",
    "examples/blinky",
    "examples/http-ota",
    "examples/pocket-hello"
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/ullnorse/ull-esp-rs"
rust-version = "1.88"

# Chip features (esp32, esp32c6) are not set here: each board crate picks its
# chip through `ull-esp-platform`'s features, so one workspace builds for
# several chips. Build one board's crates at a time (`-p`), with that chip's
# target for RISC-V chips; see README.

[workspace.dependencies]
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", default-features = false, features = ["dhcpv4", "medium-ethernet", "proto-ipv4", "tcp", "udp", "log"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["log"] }
ed25519-dalek = { version = "2.2", default-features = false }
embedded-graphics = "0.8"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io-async = "0.7.0"
esp-alloc = "0.11.0"
esp-bootloader-esp-idf = "0.6.0"
esp-hal = { version = "1.2.2", features = ["unstable", "log-04"] }
esp-println = { version = "0.18.0", features = ["log-04", "timestamp"] }
esp-radio = { version = "1.0.0-beta.1", default-features = false, features = ["wifi", "log-04", "unstable", "esp-alloc"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-radio", "log-04"] }
esp-storage = "0.10.0"
heapless = "0.8"
portable-atomic = { version = "1.15", default-features = false }
log = "0.4"
sha2 = { version = "0.10.9", default-features = false }
static_cell = "2.1.1"
thiserror = { version = "2.0.12", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

[profile.dev.package.esp-radio]
opt-level = 3
