[package]
name = "ull-esp-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable ESP32 platform mechanics for Embassy-based projects"
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["esp32", "embassy", "wifi", "embedded"]

[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

# The workspace forbids unsafe code; this crate only denies it, for the one
# exported log timestamp symbol in `runtime`.
[lints.rust]
unsafe_code = "deny"

[features]
esp32 = [
    "esp-alloc/esp32",
    "esp-bootloader-esp-idf/esp32",
    "esp-hal/esp32",
    "esp-println/esp32",
    "esp-radio/esp32",
    "esp-rtos/esp32",
    "esp-storage/esp32",
]
esp32c6 = [
    "esp-alloc/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-hal/esp32c6",
    "esp-println/esp32c6",
    "esp-radio/esp32c6",
    "esp-rtos/esp32c6",
    "esp-storage/esp32c6",
]

[dependencies]
embassy-executor.workspace = true
embassy-futures.workspace = true
embassy-net.workspace = true
embassy-sync.workspace = true
embassy-time.workspace = true
embedded-io-async.workspace = true
esp-alloc.workspace = true
esp-bootloader-esp-idf.workspace = true
esp-hal.workspace = true
esp-println.workspace = true
esp-radio.workspace = true
esp-rtos.workspace = true
esp-storage.workspace = true
heapless.workspace = true
portable-atomic.workspace = true
log.workspace = true
sha2.workspace = true
static_cell.workspace = true
ull-esp-core = { path = "../ull-esp-core" }
thiserror.workspace = true
